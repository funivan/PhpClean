name: Test

on:
  push:
  pull_request:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: burrunan/gradle-cache-action@v1.5
        with:
          arguments: check buildPlugin verifyPlugin
